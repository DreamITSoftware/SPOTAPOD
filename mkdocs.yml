site_name: SPOTAPOD Analysis Repository
site_description: >
  Aggregate-only companion analysis of three engagement-pod-adjacent
  datasets, oriented around 16 CFR 465.8. No script or page in this site
  identifies an individual record or account.
repo_url: ""
theme:
  name: readthedocs

nav:
  - Home: README.md
  - Provenance: docs/provenance.md
  - Regulatory context: docs/regulatory-context.md
  - Other regulatory signals: docs/research/other-regulatory-signals.md
  - Audience impact: docs/research/audience-impact.md
  - Algorithm/creator-strategy case study: docs/research/algorithm-strategy-advice.md
  - Book-promotion content: docs/research/book-promotion-content.md
  - Career-advice comparison: docs/research/career-advice-comparison.md
  - Topic taxonomy: docs/research/topic-taxonomy.md
  - Decision points: docs/research/decision-points.md
  - Simple title aggregate: docs/research/simple-titles.md
  - Entity mentions: docs/research/entity-mentions.md
  - Law-related content: docs/research/law-content.md
  - Speaker / thought leader: docs/research/speaker-thought-leader.md
  - Nonprofit-related content: docs/research/nonprofit-content.md
  - Investment / venture capital content: docs/research/investment-vc-content.md
  - Demographics: docs/research/demographics.md
  - Method: docs/method.md
  - Data dictionary: docs/data-dictionary.md
  - Privacy and PII: docs/privacy.md
  - Limitations: docs/limitations.md
  - Baseline profile (full output): docs/research/baseline-profile.md
  - Validation tools: tools/README.md
  - Outreach materials: outreach/README.md
  - Contributing: CONTRIBUTING.md
  - Changelog: CHANGELOG.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
